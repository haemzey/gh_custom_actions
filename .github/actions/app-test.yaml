name: Application Test

description: Run Python application quality and test checks

inputs:
  dependency:
    description: Python dependency file
    required: true

  pylint:
    description: Run Pylint
    required: false
    default: "false"

  bandit:
    description: Run Bandit
    required: false
    default: "false"

  flake8:
    description: Run Flake8
    required: false
    default: "false"

  pytest:
    description: Run Pytest
    required: false
    default: "false"

  unittest:
    description: Run unittest
    required: false
    default: "false"

runs:
  using: composite

  steps:

    - name: Install application dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r "${{ inputs.dependency }}"

    - name: Install test tools
      shell: bash
      run: |
        python -m pip install pylint bandit flake8 pytest

    - name: Run Pylint
      if: ${{ inputs.pylint == 'true' }}
      shell: bash
      run: |
        python -m pylint $(git ls-files '*.py')

    - name: Run Flake8
      if: ${{ inputs.flake8 == 'true' }}
      shell: bash
      run: |
        python -m flake8 $(git ls-files '*.py')

    - name: Run Bandit
      if: ${{ inputs.bandit == 'true' }}
      shell: bash
      run: |
        python -m bandit -r . -s B101

    - name: Run Pytest
      if: ${{ inputs.pytest == 'true' }}
      shell: bash
      run: |
        python -m pytest test/py_test.py

    - name: Run unittest
      if: ${{ inputs.unittest == 'true' }}
      shell: bash
      run: |
        python -m unittest unit_test.py

    - name: Start application
      shell: bash
      run: |
        python app.py &
        APP_PID=$!

        sleep 5

        curl --fail --retry 10 http://127.0.0.1:5000/health

        kill "$APP_PID"