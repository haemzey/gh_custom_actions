name: Docker Security Scan

description: Scan Docker image using Trivy

inputs:
  image_name:
    description: Docker image name
    required: true

  image_tag:
    description: Docker image tag
    required: true

  docker_username:
    description: Docker Hub username
    required: true

  docker_token:
    description: Docker Hub token
    required: true

runs:
  using: composite

  steps:

    - name: Docker Login
      uses: docker/login-action@v4
      with:
        username: ${{ inputs.docker_username }}
        password: ${{ inputs.docker_token }}

    - name: Trivy Scan
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ inputs.docker_username }}/${{ inputs.image_name }}:v${{ inputs.image_tag }}
        format: table
        vuln-types: os,library
        scanners: vuln
        ignore-unfixed: true
        severity: CRITICAL,HIGH
        exit-code: "1"
        output: security_scan.txt

    - name: Upload Security Report
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: security-scan
        path: security_scan.txt