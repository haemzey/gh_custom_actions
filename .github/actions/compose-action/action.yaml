name: Docker Compose Test

description: Start Docker Compose services and test container

inputs:
  image_name:
    description: Docker image name
    required: true

  image_tag:
    description: Docker image tag
    required: true

  docker_username:
    description: Docker Hub username
    required: true

  docker_token:
    description: Docker Hub token
    required: true

runs:
  using: composite

  steps:

    - name: Docker Login
      uses: docker/login-action@v4
      with:
        username: ${{ inputs.docker_username }}
        password: ${{ inputs.docker_token }}

    - name: Pull Application Image
      shell: bash
      run: |
        docker pull \
          ${{ inputs.docker_username }}/${{ inputs.image_name }}:v${{ inputs.image_tag }}

    - name: Start Docker Compose
      uses: hoverkraft-tech/compose-action@b659c744ee9bed25aea2307c017ad849bd104433
      with:
        compose-file: ./docker-compose.yaml
        services: server

    - name: Check Services Health
      uses: thegabriele97/dockercompose-health-action@main
      with:
        filename: docker-compose.yaml
        timeout: "60"
        workdir: ./
      
    - run: |
        docker compose up -d
        docker compose exec server python -m pytest

    - name: Compose Logs
      if: ${{ always() }}
      shell: bash
      run: |
        docker compose -f docker-compose.yaml logsgit remotr 