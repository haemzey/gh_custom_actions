name: Custom Smoke Test Action for CI
description: custom action to smoke test image container

inputs:
  image_name:
    reuired: true

  image_tage: 
    required: false
    default: latest

  docker_username:
    required: true

  docker_token: 
    required: true

runs: 
    using: composite
    steps:
      - name: docker login
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: docker container
        run: |
          docker run -d -p 5000:5000 --name dummy ${{ vars.DOCKER_USERNAME }}/${{ inputs.image_name }}:v${{ inputs.image_tag }}
          slepp 10

      - name: smoke test
        run: curl --fail http://localhost:5000/health || true

      - name: image cont logs
        run: docker logs dummy >> logs.txt

      - name: delete cont
        if: ${{ always() }}
        run: docker rm -rf dummy

      - uses: actions/upload-artifact@v7
        with: 
          name: logs.txt
          path: logs.txt