name: Docker Smoke Test

description: Start Docker container and perform health check

inputs:
  image_name:
    description: Docker image name
    required: true

  image_tag:
    description: Docker image tag
    required: true

  docker_username:
    description: Docker Hub username
    required: true

  docker_token:
    description: Docker Hub token
    required: true

runs:
  using: composite

  steps:

    - name: Docker Login
      uses: docker/login-action@v4
      with:
        username: ${{ inputs.docker_username }}
        password: ${{ inputs.docker_token }}

    - name: Start container
      shell: bash
      run: |
        docker run -d \
          -p 5000:5000 \
          --name dummy \
          ${{ inputs.docker_username }}/${{ inputs.image_name }}:v${{ inputs.image_tag }}

    - name: Smoke Test
      shell: bash
      run: |
        sleep 5
        curl --fail --retry 10 --retry-delay 2 \
          http://127.0.0.1:5000/health

    - name: Container Logs
      if: ${{ always() }}
      shell: bash
      run: |
        docker logs dummy > logs.txt 2>&1

    - name: Remove Container
      if: ${{ always() }}
      shell: bash
      run: |
        docker rm -f dummy || true

    - name: Upload Logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: container-logs
        path: logs.txt
        if-no-files-found: warn